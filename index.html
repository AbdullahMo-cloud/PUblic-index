    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = function() {
            return (_origFetch || window.fetch).apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {}
      })();
    </script>
